
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>PGD - Conflict API Test</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f5f7;
      font-family: Arial, sans-serif;
      color: #17212b;
    }

    main {
      max-width: 800px;
      margin: auto;
    }

    section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    h1 { font-size: 24px; }

    button {
      border: 0;
      border-radius: 8px;
      background: #176b45;
      color: white;
      padding: 14px;
      width: 100%;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled { opacity: .5; }

    .pass { color: #16803c; }
    .fail { color: #c62828; }

    .item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      overflow-wrap: anywhere;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f5f6f7;
      padding: 14px;
      border-radius: 8px;
    }

    #summary {
      font-size: 28px;
      font-weight: bold;
      margin: 15px 0;
    }
  </style>
</head>

<body>

<main>

  <section>
    <h1>PHỞ GÀ ĐỒI - SYSTEM V2.0</h1>
    <p>Kiểm thử Conflict API - C2.3-A</p>

    <p>
      Chỉ kiểm tra kết nối, phiên bản và
      cấu trúc API. Không tạo bản sao lưu,
      không thay đổi dữ liệu nghiệp vụ.
    </p>

    <button id="run">
      CHẠY KIỂM THỬ
    </button>

    <div id="summary">0/24</div>

    <div id="results"></div>
  </section>

  <section>
    <h2>API Health</h2>
    <pre id="health">Chưa kiểm tra</pre>
  </section>

</main>

<script src="draft.js?v=78423a"></script>
<script src="api.js?v=78423a"></script>

<script>
"use strict";

const button = document.getElementById("run");
const results = document.getElementById("results");
const summary = document.getElementById("summary");
const healthBox = document.getElementById("health");

button.addEventListener("click", async function() {

  button.disabled = true;
  results.textContent = "";
  healthBox.textContent = "Đang kiểm tra...";

  let passed = 0;
  let total = 0;
  let health = null;

  async function test(name, callback) {

    total++;

    const item = document.createElement("div");
    item.className = "item";

    try {

      if (await callback() !== true) {
        throw new Error("Điều kiện chưa đạt");
      }

      passed++;
      item.classList.add("pass");
      item.textContent = "PASS - " + name;

    } catch (error) {

      item.classList.add("fail");
      item.textContent =
        "FAIL - " + name + ": " + error.message;

    }

    results.appendChild(item);
    summary.textContent = passed + "/" + total;

  }

  try {

    await test("01. PGDAPI tồn tại", () =>
      typeof window.PGDAPI === "object"
    );

    await test("02. Phiên bản C2.3-A", () =>
      PGDAPI.config.VERSION === "7.8.4.3-C2.3-A"
    );

    await test("03. API protocol 7.8.1", () =>
      PGDAPI.config.API_VERSION === "7.8.1"
    );

    await test("04. Catalog 751", () =>
      PGDAPI.config.CATALOG_REVISION === "751"
    );

    await test("05. Kết nối Backend", async () => {

      health = await PGDAPI.health();

      healthBox.textContent =
        JSON.stringify(health, null, 2);

      return health.success === true;

    });

    await test("06. Backend TEST mode", () =>
      health.mode === "TEST"
    );

    await test("07. API đang hoạt động", () =>
      health.apiEnabled === true
    );

    await test("08. Request State hoạt động", () =>
      health.requestStateEnabled === true
    );

    await test("09. Conflict Revision", () =>
      health.conflictRevision ===
        "7.8.4.3-C2.2-B"
    );

    await test("10. Backup Ready", () =>
      health.conflictBackupReady === true
    );

    await test("11. Verify Ready", () =>
      health.conflictVerifyReady === true
    );

    await test("12. Conflict API Integrated", () =>
      health.conflictApiIntegrated === true
    );

    await test("13. Conflict API Enabled", () =>
      health.conflictApiEnabled === true
    );

    await test("14. Conflict Health", async () => {

      const result = await PGDAPI.conflictHealth();

      return result.conflictApiEnabled === true;

    });

    await test("15. API Begin", () =>
      typeof PGDAPI.conflictBackupBegin === "function"
    );

    await test("16. API Local Photo", () =>
      typeof PGDAPI.conflictBackupLocalPhoto === "function"
    );

    await test("17. API Server Photo", () =>
      typeof PGDAPI.conflictBackupServerPhoto === "function"
    );

    await test("18. API Status", () =>
      typeof PGDAPI.conflictBackupStatus === "function"
    );

    await test("19. API Verify", () =>
      typeof PGDAPI.conflictBackupVerify === "function"
    );

    await test("20. API Confirm", () =>
      typeof PGDAPI.conflictBackupConfirm === "function"
    );

    await test("21. Giữ nguyên API cũ", () => {

      const methods = [
        "login",
        "logout",
        "getProfile",
        "restoreDraft",
        "saveDraft",
        "savePhoto",
        "readPhoto",
        "removePhoto",
        "inventoryCatalog",
        "checklistCatalog",
        "validateInventory",
        "validateChecklist",
        "departmentStatus",
        "requestState",
        "sendPending"
      ];

      return methods.every(name =>
        typeof PGDAPI[name] === "function"
      );

    });

    await test("22. Chưa tích hợp xử lý xung đột", () =>
      health.conflictResolutionIntegrated === false
    );

    await test("23. Chặn truy cập khi chưa đăng nhập",
      async () => {

        const context = {
          date: "2026-12-10",
          branch: "CS1",
          shift: "SANG",
          department: "BEP_PHO",
          employee: "TEST_API01"
        };

        try {

          await PGDAPI.conflictBackupStatus(
            context,
            "TEST_BACKUP_123456789"
          );

          return false;

        } catch (error) {

          return error.code === "CONTEXT_MISMATCH" ||
            error.code === "LOGIN_REQUIRED";

        }

      }
    );

    await test("24. Các module chưa triển khai vẫn tắt",
      () =>
        health.telegramEnabled === false &&
        health.finalizationEnabled === false &&
        health.revenueEnabled === false
    );

  } finally {

    summary.textContent = passed + "/24";

    summary.className =
      passed === 24 ? "pass" : "fail";

    button.disabled = false;

  }

});
</script>

</body>
</html>
